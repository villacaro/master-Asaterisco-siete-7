<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <title>
    {%block title%}	
    {%endblock%}
  </title>
  <style type="text/css">
    {% block style %}

      table.tdefault {
        border: 1px solid black;
      }
      
      @media print {
        @page {
          size: letter landscape;
          margin-left: 1.5cm;
          margin-right: 1.5cm;
          margin-top: 2cm;
          margin-bottom: 1.5cm;

          @frame pag_number{
            -pdf-frame-content: pag_number;
            margin-left: 25cm;
            margin-top: 1cm;
          }
          @frame reporte {
            -pdf-frame-content: reporte;
            margin-top: 1cm;
            margin-left: 1.5cm;
            margin-right: 1.5cm;
          }
          @frame pag_title {
            -pdf-frame-content: pag_title;
            margin-top: 1cm;
            margin-left: 1cm;
            margin-right: 1cm;
          }
        }
      }

    {%endblock%}	
  </style>
</head>
<body>
  <div>
      <div id='reporte'>
        <table>
              <tr>
                <td>
                  <h1>
                    Sistema: 
                    {% if sistema %} 
                      {{ sistema }}
                    {% else %}
                      Todos
                    {% endif %}
                  </h1>
                </td>
                <td>
                  <h2>
                    {{ reporte.titulo }}
                  </h2>
                </td>
                <td>
                  Generado por 
                  <i> {{ usuario }} </i> 
                  <i> 
                    {% if comercializadora %} 
                      {{ comercializadora }}
                    {% endif %}
                  </i>
                  el {{fecha}}
                </td>
                <td>
                  <div id="pag_number">
                    Pagina <pdf:pagenumber>
                  </div>
                </td>
              </tr>
          </table>
      </div>
      <div>
        {%block content%}
        
        {%endblock%}
      </div>
  </div>
</body>
</html>
