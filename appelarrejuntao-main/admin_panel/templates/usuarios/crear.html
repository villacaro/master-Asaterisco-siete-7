{% extends "base.html" %}
{% block title %}Crear Usuario – Admin{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:auto;">
  <h2>➕ Crear Nuevo Usuario</h2>
  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label>Nombre (opcional)</label>
      <input type="text" name="nombre" placeholder="Ej: Juan Pérez" />
    </div>
    <div class="form-group">
      <label>Correo Electrónico *</label>
      <input type="email" name="email" placeholder="juan@correo.com" required />
    </div>
    <div class="form-group">
      <label>Contraseña * (mínimo 6 caracteres)</label>
      <input type="password" name="password" placeholder="••••••••" required minlength="6" />
    </div>
    <div style="display:flex;gap:0.75rem;margin-top:1.25rem;">
      <button type="submit" class="btn btn-gold">✅ Crear Usuario</button>
      <a href="{% url 'lista_usuarios' %}" class="btn btn-purple">← Volver</a>
    </div>
  </form>
</div>
{% endblock %}
