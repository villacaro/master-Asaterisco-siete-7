<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin – EL ARREJUNTAO{% endblock %}</title>
  <style>
    :root {
      --gold: #f5d020; --purple: #7c3aed; --bg: #0d0d1a; --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.12); --text: #f1f5f9; --muted: rgba(255,255,255,0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif;
           min-height: 100vh; }
    .topbar { background: linear-gradient(135deg,#1a0533,#0f172a);
              border-bottom: 1px solid rgba(245,208,32,0.2);
              padding: 0.75rem 1.5rem;
              display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { font-size: 1.1rem; font-weight: 900; font-style: italic;
                 background: linear-gradient(135deg,#f5d020,#f97316);
                 -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .topbar nav a { color: var(--muted); text-decoration: none; margin-left: 1rem;
                    font-size: 0.85rem; transition: color 0.2s; }
    .topbar nav a:hover { color: var(--gold); }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card); border: 1px solid var(--border);
            border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.2rem; font-weight: 900; color: var(--gold); margin-bottom: 1rem; }
    .btn { display: inline-block; padding: 0.45rem 0.9rem; border-radius: 0.5rem;
           font-size: 0.82rem; font-weight: 700; cursor: pointer; text-decoration: none;
           border: none; transition: all 0.2s; }
    .btn-gold   { background: var(--gold); color: #042114; }
    .btn-red    { background: rgba(239,68,68,0.2); color: #fca5a5;
                  border: 1px solid rgba(239,68,68,0.35); }
    .btn-green  { background: rgba(34,197,94,0.2); color: #86efac;
                  border: 1px solid rgba(34,197,94,0.35); }
    .btn-purple { background: rgba(124,58,237,0.2); color: #c4b5fd;
                  border: 1px solid rgba(124,58,237,0.35); }
    .btn:hover  { filter: brightness(1.2); }
    .messages { margin-bottom: 1rem; }
    .msg { padding: 0.6rem 1rem; border-radius: 0.5rem; font-size: 0.88rem; margin-bottom: 0.5rem; }
    .msg.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .msg.error   { background: rgba(239,68,68,0.15);  border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.65rem 0.75rem; text-align: left;
             border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { color: var(--gold); font-size: 0.72rem; text-transform: uppercase;
         letter-spacing: 0.08em; }
    tr:hover td { background: rgba(255,255,255,0.03); }
    .badge { display: inline-block; padding: 0.18rem 0.55rem; border-radius: 9999px;
             font-size: 0.68rem; font-weight: 700; }
    .badge-green  { background: rgba(34,197,94,0.2); color: #86efac; }
    .badge-red    { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .badge-purple { background: rgba(124,58,237,0.2); color: #c4b5fd; }
    input, select { background: rgba(0,0,0,0.3); border: 1px solid var(--border);
                    color: var(--text); border-radius: 0.5rem; padding: 0.6rem 0.8rem;
                    width: 100%; font-size: 0.9rem; outline: none; }
    input:focus { border-color: var(--gold); }
    label { display: block; font-size: 0.72rem; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.3rem; }
    .form-group { margin-bottom: 1rem; }
    .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>🎰 EL ARREJUNTAO — Admin</h1>
    <nav>
      <a href="{% url 'lista_usuarios' %}">👥 Usuarios</a>
      <a href="{% url 'crear_usuario' %}">➕ Nuevo</a>
      <a href="/admin/">⚙️ Django Admin</a>
    </nav>
  </div>
  <div class="container">
    {% if messages %}
    <div class="messages">
      {% for msg in messages %}
      <div class="msg {{ msg.tags }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
