{% load humanize %}
{% load i18n %}
                
                <div class="col-xs-12">
                    <div class="panel panel-default">
                        <div class="panel-head">
                           <div class="title left">
                                <p class="left">Mensajes</p>
                          </div>            
                        </div>
                        <form id="filter_form" action='' method='post' encoding='utf-8'>{% csrf_token %}
                              <div class="panel-body">
                                <div class="form">
                                  <div class="row">
                                    <div class="column hd-4 lg-6 md-12">
                                      {% for item in form %}
                                        {% if item.is_hidden == 0 %}
                                          <div class="row form form-group">
                                            <div class="column md-4 sm-12">
                                              <div class="form-label">{{ item.label }}</div>
                                            </div>
                                            <div class="column md-8 sm-12">
                                              {{ item }}
                                            </div>
                                          </div>
                                        {% else %}
                                          {{ item }}
                                        {% endif %}
                                      {% endfor %}
                                    </div>
                                
                                  </div>
                                </div>
                              </div>
                        </form>

                         <div class="panel-footer panel-shadow">
                              <div class="col-xs-12">
                                <p>
                                  <button id="id_consultar" class='btn btn-primary' >Buscar 
                                  </button>
                                </p>
                              </div>
                          </div>
                        <div class="panel-body panel-body-border panel-shadow">
                            <form id="delete_form" action='{% url 'admin_mail_message_delete' %}' charset='utf-8' method='post'>
                                {% csrf_token %}
                              
                            <table class='table datatable table-striped table-panel table-small table-hover'>
                              <thead>
                                <tr>
                                  <th width="5%">Nro</th>
                                  <th>Asunto</th>
                                  <th>Enviado</th>
                                  <th width="8%">Priodidad</th>
                                  <th width="8%"></th>
                                </tr>
                              </thead>

                                <tbody>

                                </tbody>
                              
                            </table>
                            </form>
                        </div>
                    </div>
                </div>

  <script>

    $('#id_consultar').on("click",function () {
        consultar();
    });

    function consultar() {
        var $form = $("#filter_form"),
        url = "{{name_url_data_table}}";
        data = $form.serialize();
        //$(".datatable").find("td").empty()
        if ( typeof(dt_table) != "undefined" ){
          dt_table.fnDestroy()
        }

        dt_table = $('.datatable').dataTable({
          "sPaginationType": "full_numbers",
          "iDisplayLength" : 25,
          "bFilter": true,
          "bProcessing": true,
          "bServerSide": true,
          "sAjaxSource": url,
          "sProcessing": "Procesando...",
          "fnServerData": function ( sSource, aoData, fnCallback ) {
            $.ajax({
                  "dataType": 'json',
                  "type": "GET",
                  "processData": true,
                  "contentType": "application/json",
                  "url": url + '?' + $.param(aoData), 
                  "data": data, 
                  "success": function(result){
                    fnCallback(result);
                  },
                  error : function(xhr,errmsg,err) {
                    console.log("#================ERROR=====================")
                    console.log( xhr )
                    console.log( errmsg )
                    console.log( err )
                    console.log("#==========================================") 
                  }
              });
          }
        });
        dt_table.fnSetFilteringDelay(500);
        dt_table.fnAdjustColumnSizing()
    }

    consultar();

  </script>
