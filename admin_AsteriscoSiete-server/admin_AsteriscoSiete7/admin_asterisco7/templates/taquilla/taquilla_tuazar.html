<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taquilla Tu Azar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.2/qz-tray.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-tuazar-light { background-color: #f9f9fa; }
        .text-tuazar-purple { color: #6b21a8; }
        .bg-tuazar-purple { background-color: #6b21a8; }
        .border-tuazar-purple { border-color: #6b21a8; }
        .bg-tuazar-purple-light { background-color: #e9d5ff; }
        .text-tuazar-gray { color: #6b7280; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-screen w-full flex flex-col overflow-hidden">

    <!-- TOP BAR -->
    <header class="bg-white h-14 border-b border-gray-200 flex justify-between items-center px-4 shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-lg font-bold text-gray-800">Venta</h1>
            
            <div class="flex items-center gap-2 bg-gray-100 rounded-full px-3 py-1 text-xs text-gray-600 font-medium">
                <div class="w-2 h-2 rounded-full bg-purple-600" id="online-indicator"></div>
                <span>En línea</span>
            </div>

            <button id="printerBtn" onclick="connectPrinter()" class="flex items-center gap-2 bg-red-50 text-red-600 rounded-full px-3 py-1 text-xs font-medium border border-red-100 hover:bg-red-100 transition-colors">
                <div class="w-2 h-2 rounded-full bg-red-500" id="printer-dot"></div>
                <span id="printer-text">Seleccionar impresora v</span>
            </button>
        </div>

        <div class="flex items-center gap-4">
            <div class="text-sm text-gray-500 font-medium" id="datetime-display">
                Cargando...
            </div>
            <!-- Window controls placeholder -->
            <div class="flex gap-3 text-gray-400">
                <svg class="w-4 h-4 cursor-pointer hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 12H6"></path></svg>
                <svg class="w-4 h-4 cursor-pointer hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4h16v16H4z"></path></svg>
                <svg class="w-4 h-4 cursor-pointer hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- LEFT PANEL (Selection) -->
        <section class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto">
            
            <!-- Producto -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-gray-600 font-medium text-sm">Producto</h2>
                    <div class="flex bg-gray-100 rounded-full p-1 text-xs">
                        <button id="tab-triples" onclick="switchTab('triples')" class="px-4 py-1 rounded-full bg-white shadow-sm font-medium text-gray-800 transition-colors">Triples</button>
                        <button id="tab-animalitos" onclick="switchTab('animalitos')" class="px-4 py-1 rounded-full text-gray-500 hover:text-gray-800 transition-colors">Animalitos</button>
                        <button id="tab-extras" onclick="switchTab('extras')" class="px-4 py-1 rounded-full text-gray-500 hover:text-gray-800 transition-colors">Extras</button>
                    </div>
                </div>
                
                <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide" id="products-container">
                    <!-- Products will be injected here -->
                    <button class="flex items-center gap-2 border-2 border-tuazar-purple bg-tuazar-purple-light/20 rounded-xl px-4 py-2 shrink-0">
                        <div class="w-8 h-8 bg-purple-100 rounded flex items-center justify-center text-purple-600 text-xs font-bold">EA</div>
                        <span class="font-semibold text-gray-800 text-sm">El Arrejuntao</span>
                    </button>
                </div>
            </div>

            <!-- Sorteos & Juegos Container -->
            <div class="flex gap-4 flex-1 min-h-[400px]">
                <!-- Sorteos -->
                <div class="flex-1 bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex flex-col">
                    <div class="flex justify-between items-center mb-4 shrink-0">
                        <h2 class="text-gray-600 font-medium text-sm">Sorteos <span class="text-gray-400 text-xs ml-1" id="sorteos-count">0/0</span></h2>
                        <button id="btn-select-all-sorteos" onclick="selectAllSorteos()" class="text-xs text-tuazar-purple font-medium flex items-center gap-1 hover:underline">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>Seleccionar todos</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-3 gap-2 overflow-y-auto pr-1" id="sorteos-container">
                        <!-- Injected -->
                    </div>
                </div>

                <!-- Juego (Triples) -->
                <div id="panel-juegos" class="flex-1 bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-gray-600 font-medium text-sm">Juego <span class="text-gray-400 text-xs ml-1" id="juegos-count">0/4</span></h2>
                        <button id="btn-select-all-juegos" onclick="selectAllJuegos()" class="text-xs text-tuazar-purple font-medium flex items-center gap-1 hover:underline">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            <span>Seleccionar todos</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2" id="juegos-container">
                        <!-- Injected -->
                    </div>
                </div>

                <!-- Animalitos Panel -->
                <div id="panel-animalitos" class="flex-1 bg-white rounded-xl p-4 shadow-sm border border-gray-100 hidden flex-col">
                    <div class="flex justify-between items-center mb-3 shrink-0">
                        <h2 class="text-gray-600 font-medium text-sm">Animalitos <span class="text-gray-400 text-xs ml-1" id="animalitos-count">0/38</span></h2>
                    </div>
                    <div class="mb-3 shrink-0 relative">
                        <svg class="w-4 h-4 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        <input type="text" id="search-animalito" onkeyup="filterAnimalitos()" class="w-full border border-gray-200 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:border-tuazar-purple" placeholder="Buscar por número o nombre...">
                    </div>
                    <div class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-2 overflow-y-auto pr-1 pb-2" id="animalitos-container">
                        <!-- Injected -->
                    </div>
                </div>
            </div>

            <!-- Signos Panel (Only for Triples) -->
            <div id="panel-signos" class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-gray-600 font-medium text-sm">Signos <span class="text-gray-400 text-xs ml-1" id="signos-count">0/12</span></h2>
                    <button id="btn-select-all-signos" onclick="selectAllSignos()" class="text-xs text-tuazar-purple font-medium flex items-center gap-1 hover:underline">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Seleccionar todos
                    </button>
                </div>
                <div class="flex flex-wrap gap-2" id="signos-container">
                    <!-- Injected -->
                </div>
            </div>

            <!-- Spacer removed -->

            <!-- Bottom Input Area -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                <div class="flex gap-4 mb-4">
                    <div class="flex-[3]">
                        <label class="block text-gray-600 font-medium text-sm mb-1">Apuestas</label>
                        <input type="text" id="apuesta-input" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-gray-800 focus:outline-none focus:border-tuazar-purple focus:ring-1 focus:ring-tuazar-purple" placeholder="123 · p123 · *23">
                    </div>
                    <div class="flex-[1]">
                        <label class="block text-gray-600 font-medium text-sm mb-1">Monto</label>
                        <div class="relative">
                            <span class="absolute left-3 top-2.5 text-gray-400 text-sm">Bs</span>
                            <input type="number" id="monto-input" class="w-full border border-gray-300 rounded-lg pl-8 pr-4 py-2.5 text-gray-800 focus:outline-none focus:border-tuazar-purple focus:ring-1 focus:ring-tuazar-purple" placeholder="50">
                        </div>
                    </div>
                </div>
                
                <!-- Botón Animalitos -->
                <div id="btn-animalitos" class="w-full hidden">
                    <button onclick="agregarAlTicket('normal')" class="w-full bg-tuazar-purple hover:bg-purple-900 text-white font-medium rounded-lg py-3 flex items-center justify-center gap-2 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Agregar al ticket
                        <span class="bg-white/20 px-2 py-0.5 rounded text-xs ml-2">Enter</span>
                    </button>
                </div>
                
                <!-- Botones Triples -->
                <div id="btn-triples" class="flex flex-col gap-3 w-full">
                    <button onclick="agregarAlTicket('normal')" class="w-full bg-tuazar-purple hover:bg-purple-900 text-white font-medium rounded-lg py-3 flex items-center justify-center gap-2 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Agregar al ticket
                        <span class="bg-white/20 px-2 py-0.5 rounded text-xs ml-2">Enter</span>
                    </button>
                    <div class="grid grid-cols-4 gap-2 w-full">
                        <button onclick="agregarAlTicket('permuta')" class="bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-lg font-bold text-[11px] transition-colors shadow-sm tracking-wide">PERMUTA</button>
                        <button onclick="agregarAlTicket('serie')" class="bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-lg font-bold text-[11px] transition-colors shadow-sm tracking-wide">SERIE</button>
                        <button onclick="agregarAlTicket('corrida')" class="bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-lg font-bold text-[11px] transition-colors shadow-sm tracking-wide">CORRIDA</button>
                        <button onclick="toggleMultipleMode()" id="btn-multiple-mode" class="bg-amber-500 hover:bg-amber-600 text-white py-2.5 rounded-lg font-bold text-[11px] transition-colors shadow-sm tracking-wide">MÚLTIPLE</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL (Ticket) -->
        <aside class="w-80 bg-white border-l border-gray-200 flex flex-col shrink-0">
            <div class="p-4 border-b border-gray-100 flex items-center gap-2">
                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <h2 class="font-bold text-gray-800">Ticket</h2>
            </div>

            <div class="flex-1 overflow-y-auto p-4 flex flex-col" id="ticket-container">
                <!-- Empty State -->
                <div class="m-auto text-center text-gray-400" id="empty-ticket-state">
                    <svg class="w-12 h-12 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <p class="font-medium text-gray-600 mb-1">Sin jugadas</p>
                    <p class="text-xs">Arma la jugada y agrégala al ticket.</p>
                </div>
                
                <!-- Ticket items will be injected here -->
                <div id="ticket-items" class="flex flex-col gap-2 w-full hidden"></div>
            </div>

            <div class="p-4 border-t border-gray-200 bg-gray-50">
                <div class="flex justify-between items-end mb-4">
                    <span class="text-xs font-bold text-gray-500 tracking-wider">TOTAL</span>
                    <div class="text-right">
                        <span class="text-2xl font-bold text-gray-900" id="ticket-total">0,00</span>
                        <span class="text-sm font-semibold text-gray-500">VEF</span>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="printBtn" onclick="imprimirTicket()" class="flex-1 bg-purple-300 text-white font-medium rounded-lg py-2.5 flex items-center justify-center gap-2 cursor-not-allowed transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        Impresora no activa
                    </button>
                    <button onclick="limpiarTicket()" class="px-4 bg-white border border-gray-300 text-gray-600 font-medium rounded-lg py-2.5 flex items-center justify-center hover:bg-gray-50 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        Borrar
                    </button>
                </div>
            </div>
        </aside>

    </main>

    <script>
        // State
        let lotteries = [
                // TRIPLES

        function getPermutations(str) {
            if (str.length <= 1) return [str];
            let perms = [];
            for (let i = 0; i < str.length; i++) {
                let char = str[i];
                if (str.indexOf(char) != i) continue; // Skip duplicates
                let remaining = str.slice(0, i) + str.slice(i + 1, str.length);
                for (let subPerm of getPermutations(remaining)) {
                    perms.push(char + subPerm);
                }
            }
            return perms;
        }


        function procesarJugada(prod, sorteosElegidos, apuestaVal, montoVal, modo, juegosElegidos, signosElegidos, tabActivo) {
            let generados = 0;
            const sorteosArr = sorteosElegidos.filter(s => prod.sorteos.includes(s));
            if (sorteosArr.length === 0) return 0; // No valid sorteos for this product

            if (tabActivo === 'triples') {
                const juegosArr = Array.from(juegosElegidos).map(id => juegosConfig.find(j => j.id === id));
                const tieneJuegoSigno = juegosArr.some(j => j.id === 'S');
                if(tieneJuegoSigno && signosElegidos.size === 0) {
                    Swal.fire('Falta el Signo', 'Has seleccionado Triple + Signo. Por favor selecciona al menos un signo.', 'warning');
                    return -1;
                }

                let jugadasGeneradas = [];
                const parts = apuestaVal.split(',').map(s => s.trim()).filter(s => s);
                
                if (modo === 'permuta') {
                    parts.forEach(part => {
                        const perms = getPermutations(part);
                        jugadasGeneradas.push(...perms);
                    });
                } else if (modo === 'serie') {
                    parts.forEach(part => {
                        let base = part.replace(/[^0-9]/g, '');
                        if (base.length > 2) base = base.slice(-2);
                        for (let i = 0; i <= 9; i++) {
                            jugadasGeneradas.push(i.toString() + base);
                        }
                    });
                } else if (modo === 'corrida') {
                    parts.forEach(part => {
                        let base = part.replace(/[^0-9]/g, '');
                        if (base.length > 2) base = base.slice(0, 2);
                        for (let i = 0; i <= 9; i++) {
                            jugadasGeneradas.push(base + i.toString());
                        }
                    });
                } else {
                    jugadasGeneradas = parts;
                }

                sorteosArr.forEach(sorteo => {
                    juegosArr.forEach(juego => {
                        jugadasGeneradas.forEach(numGenerado => {
                            if (juego.id === 'S') {
                                signosElegidos.forEach(signo => {
                                    currentTicket.push({
                                        id: Date.now() + Math.random(),
                                        lottery: prod.name,
                                        sorteo: sorteo,
                                        juego: juego.name + ' (' + signo + ')',
                                        numero: numGenerado,
                                        monto: montoVal
                                    });
                                    generados++;
                                });
                            } else {
                                currentTicket.push({
                                    id: Date.now() + Math.random(),
                                    lottery: prod.name,
                                    sorteo: sorteo,
                                    juego: juego.name,
                                    numero: numGenerado,
                                    monto: montoVal
                                });
                                generados++;
                            }
                        });
                    });
                });
            } else if (tabActivo === 'animalitos') {
                const anims = apuestaVal.split(',').map(s => s.trim()).filter(s => s);
                sorteosArr.forEach(sorteo => {
                    anims.forEach(anim => {
                        currentTicket.push({
                            id: Date.now() + Math.random(),
                            lottery: prod.name,
                            sorteo: sorteo,
                            juego: 'Animalito',
                            numero: anim,
                            monto: montoVal
                        });
                        generados++;
                    });
                });
            } else if (tabActivo === 'extras') {
                const nums = apuestaVal.split(',').map(s => s.trim()).filter(s => s);
                let hasError = false;
                
                nums.forEach(num => {
                    const soloNumeros = num.replace(/[^0-9]/g, '');
                    if (prod.name.includes('Pegadito') && soloNumeros.length !== 5) {
                        hasError = true;
                        Swal.fire('Error', 'El Pegadito requiere exactamente 5 dígitos', 'warning');
                    } else if (prod.name.includes('Arrimao') && soloNumeros.length !== 4) {
                        hasError = true;
                        Swal.fire('Error', 'El Arrimao requiere exactamente 4 dígitos', 'warning');
                    }
                });

                if(hasError) return -1;

                sorteosArr.forEach(sorteo => {
                    nums.forEach(num => {
                        currentTicket.push({
                            id: Date.now() + Math.random(),
                            lottery: prod.name,
                            sorteo: sorteo,
                            juego: 'Extra',
                            numero: num,
                            monto: montoVal
                        });
                        generados++;
                    });
                });
            }
            return generados;
        }

        function agregarAlTicket(modo = 'normal') {
            const apuestaInput = document.getElementById('apuesta-input').value.trim();
            const montoInput = parseFloat(document.getElementById('monto-input').value);

            if(selectedProducts.length === 0) return Swal.fire('Error', 'Selecciona al menos un producto', 'warning');
            if(selectedSorteos.size === 0) return Swal.fire('Error', 'Selecciona al menos un sorteo', 'warning');
            if(!apuestaInput) return Swal.fire('Error', 'Ingresa la jugada', 'warning');
            if(!montoInput || montoInput <= 0) return Swal.fire('Error', 'Ingresa un monto válido', 'warning');

            if (activeTab === 'triples' && selectedJuegos.size === 0) {
                return Swal.fire('Error', 'Selecciona al menos un juego', 'warning');
            }

            // Modo normal / permuta / serie / corrida aplicado a TODOS los productos seleccionados
            let totalGenerados = 0;
            for (const prod of selectedProducts) {
                const res = procesarJugada(prod, Array.from(selectedSorteos), apuestaInput, montoInput, modo, selectedJuegos, selectedSignos, activeTab);
                if (res === -1) return; // Error occurred, usually Swal is already shown
                totalGenerados += res;
            }

            if (totalGenerados === 0) {
                return Swal.fire('Aviso', 'Las loterías seleccionadas no tienen sorteos en los horarios que elegiste.', 'info');
            }

            if (activeTab === 'animalitos') {
                selectedAnimalitos.clear();
                renderAnimalitos(document.getElementById('search-animalito') ? document.getElementById('search-animalito').value : '');
            }

            document.getElementById('apuesta-input').value = '';
            document.getElementById('monto-input').value = '';
            document.getElementById('apuesta-input').focus();
            
            // Si estaba en modo múltiple, al generar el ticket podemos dejarlo encendido para que sigan marcados.
            renderTicket();
            
            if (selectedProducts.length > 1) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Jugada Múltiple Exitosa!',
                    text: `Se agregaron ${totalGenerados} jugadas al ticket.`,
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        }
        function renderTicket() {
            const emptyState = document.getElementById('empty-ticket-state');
            const itemsContainer = document.getElementById('ticket-items');
            
            if(currentTicket.length === 0) {
                emptyState.classList.remove('hidden');
                itemsContainer.classList.add('hidden');
                document.getElementById('ticket-total').innerText = '0,00';
                return;
            }

            emptyState.classList.add('hidden');
            itemsContainer.classList.remove('hidden');

            let total = 0;
            
            itemsContainer.innerHTML = currentTicket.map(t => {
                total += t.monto;
                return `
                <div class="flex justify-between items-center bg-gray-50 border border-gray-100 p-2 rounded-lg text-sm">
                    <div>
                        <div class="font-bold text-gray-800">${t.numero} <span class="text-xs font-normal text-gray-500 ml-1">x ${t.monto.toFixed(2)}</span></div>
                        <div class="text-[10px] text-gray-500 leading-tight">${t.lottery} • ${t.sorteo} • ${t.juego}</div>
                    </div>
                    <button onclick="borrarJugada(${t.id})" class="text-red-400 hover:text-red-600 p-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                </div>`;
            }).join('');
            
            document.getElementById('ticket-total').innerText = total.toLocaleString('es-VE', {minimumFractionDigits:2});
        }

        function borrarJugada(id) {
            currentTicket = currentTicket.filter(t => t.id !== id);
            renderTicket();
        }

        function limpiarTicket() {
            if(currentTicket.length === 0) return;
            Swal.fire({
                title: '¿Borrar ticket?',
                text: "Se eliminarán todas las jugadas actuales",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, borrar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    currentTicket = [];
                    renderTicket();
                }
            });
        }
