{% load i18n %}
{% load humanize %}

            {% include 'js/admin_comercializacion_ajax.html' %}

                <div class="col-xs-12">
                  <div class="panel panel-default">
                      <div class="panel-head">
                       <p>
                        Factores de riesgo
                       </p>
                      </div>
                          <form id="form_filters" action='' method='get' encoding='utf-8'>
                            <div class="panel-body panel-filters">
                            <input type="hidden" id="cadena" value="{{model}}">
                                <div class="row">            
                                    <div class="col-xs-4">
                                        <div class="form-margin">
                                              {% for item in form %}
                                                 <div class="row form form-group">
                                                  <div class="col-xs-4">
                                                    <div class="form-label">{{ item.label }}</div>
                                                  </div>
                                                  <div class="col-xs-8">
                                                    {{ item }}
                                                  </div>
                                                </div>
                                            {% endfor %}
                                          </div>
                                      </div>
                                </div>
                              </div>
                              </form>
                              <div class="panel-footer panel-shadow">
                                  <div class="col-xs-12">
                                    <p>
                                      <button id="id_consultar" class='btn btn-primary' >Buscar </button>
                                    </p>
                                  </div>
                              </div>
                  </div>
                </div>
                <div class="col-xs-12">
                    <div class="panel panel-default">
                        <div class="panel-head">
                          <p class="title left">
                            Factores de riesgo de {{cadena}}
                          </p>
                        </div>
                        <div class="panel-body panel-body-border panel-shadow">
                            <table class='table datatable table-striped table-panel table-small table-hover'>                              
                              <thead>
                                <tr>
                                  <th>N°</th>
                                  <th>{{cadena}}</th>
                                  <th>N° de factores</th>
                                  <th>Actualizado</th>
                                  <th></th>
                                </tr>
                              </thead>
                              <tbody>
                                  <tr>
                                  </tr>
                              </tbody>
                            </table>
                        </div>
                    </div>
                </div>
