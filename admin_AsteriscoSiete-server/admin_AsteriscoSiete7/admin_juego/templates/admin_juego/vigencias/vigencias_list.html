{% extends 'base.html' %}
{% block content %}
{% load static %}
              <div class="row">
                <div class="col-xs-12">
                   <div class="page-toolbar page-toolbar-default">
                        <div class="page-toolbar-body page-toolbar-border">
                            <h1><i class="icon-event-note"></i> Temporadas</h1>
                            <p class="subtitle">Lista</p>
                        </div>
                        <div class="page-toolbar-footer page-toolbar-shadow">
                            <ul class="breadcrumb">
                                <li><a href="/"><i class="icon-home"></i> Inicio</a></li>
                                <li><i class="icon-event-note"></i> Temporadas</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="container">
                  <div class="container-margin">
                      {% include 'admin_juego/temporadas/object_table_list.html' %}
                      {% include 'admin_juego/temporadas/pagination.html' %}
                  </div>
                </div>
            </div>
{% endblock %}
{% block js %}
<script type="text/javascript">


///////////////////////////////////////////////////////
///////////////////////////////////////////////////////
$('#id_deporte').on("change",torneosbydeporte);
$('#id_torneo').on("change",temporadasbytorneo);
  
function torneosbydeporte() {
  $('#id_torneo').empty()
  $('#id_torneo').trigger("chosen:updated");
  $('#id_temporada').empty()
  $('#id_temporada').trigger("chosen:updated");
  var id = $(this).val();
  dajax(
        {
          "deporte": id
        },
        '{% url "admin_juego_torneos_by_deporte_ajax" %}',
        "type_deportes_ligas"
  );
}

function temporadasbytorneo() {
  $('#id_temporada').empty()
  $('#id_temporada').trigger("chosen:updated");
  var id = $(this).val();
  if (id){
    dajax(
        {
          "liga": id
        },
        '{% url "admin_juego_temporadas_by_torneo_ajax" %}',
        "type_ligas_temporadas"
    );
  }
}

function dajax(data, url, process){
    $.ajax({
        data : data,
        url : url,
        type : 'get',
        success : function(data_recibe){
            if(process == "type_deportes_ligas"){
              $('#id_torneo').empty();
              if(data_recibe.length > 0){
                $("#id_torneo").append('<option value="" >Seleccione una liga</option>');
                $.each(data_recibe, function(obj){
                  $("#id_torneo").append('<option value="'+data_recibe[obj].pk+'">'+data_recibe[obj].nombre+'</option>');
                });
              }else{
                $("#id_torneo").append('<option value="0" >No se encontraron datos, selecciona otro deporte</option>');
              }
              $("#id_torneo").trigger("chosen:updated"); 
            }else if (process == "type_ligas_temporadas"){
              $('#id_temporada').empty();
              if(data_recibe.length > 0){
                $("#id_temporada").append('<option value="" >Seleccione una temporada</option>');
                $.each(data_recibe, function(obj){
                  $("#id_temporada").append('<option value="'+data_recibe[obj].pk+'">'+data_recibe[obj].nombre+'</option>');
                });
              }else{
                $("#id_temporada").append('<option value="0" >No se encontraron datos, selecciona otra liga</option>');
              }
              $("#id_temporada").trigger("chosen:updated"); 
            }
          },
        error : function(xhr,errmsg,err) {
          alert(xhr.status + ": " + xhr.responseText);   
          console.log(xhr.status + ": " + xhr.responseText);    
        }
      });
  }

///////////////////////////////////////////////////////
///////////////////////////////////////////////////////

  $('#id_consultar').on("click",function () {
      consultar()
  });

  json = $("#form_filters").serializeArray()
  count = 0
  for( obj in json){
    if(json[obj].value)
    {
      count++
    }
  }
  
  if ( count >= 1){
    consultar() 
  }

  function consultar() {
      var $form = $("#form_filters"),
      url = "{% url 'temporadas_list_datatables' %}";
      data = $form.serialize();
      //$(".datatable").find("td").empty()
      if ( typeof(dt_table) != "undefined" ){
        dt_table.fnDestroy()
      }

      dt_table = $('.datatable').dataTable({
        "sPaginationType": "full_numbers",
        "iDisplayLength" : 25,
        "bFilter": true,
        "bProcessing": true,
        "bServerSide": true,
        "sAjaxSource": url,
        "sProcessing": "Procesando...",
        "fnServerData": function ( sSource, aoData, fnCallback ) {
          $.ajax({
                "dataType": 'json',
                "type": "GET",
                "processData": true,
                "contentType": "application/json",
                "url": url + '?' + $.param(aoData), 
                "data": data, 
                "success": function(result){
                  fnCallback(result);
                },
                error : function(xhr,errmsg,err) {
                  console.log("#================ERROR=====================")
                  console.log( xhr )
                  console.log( errmsg )
                  console.log( err )
                  console.log("#==========================================") 
                }
            });
        }
      });
      dt_table.fnSetFilteringDelay(500);
  }
</script>
{% endblock %}
