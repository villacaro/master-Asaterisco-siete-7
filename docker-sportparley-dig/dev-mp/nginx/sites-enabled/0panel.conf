upstream panel_balanceado{
    server panel:8000;
}
server {
    listen 80;
    listen 443 ssl;

    server_name dev.panel;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    try_files $uri @panel;

    location /media {
        alias /usr/src/admin_banklotsports/admin_banklotsports/media;
        expires 365d;
    }

    location /static {
       alias /usr/src/admin_banklotsports/staticfiles;
       expires 365d;
    }

    location / {
        proxy_pass http://panel_balanceado;
        proxy_redirect off;
        proxy_read_timeout 5m;
        proxy_set_header Host $host:80;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}