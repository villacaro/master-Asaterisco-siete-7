upstream ws_balanceado{
    server ws:8001;
}
server {
    listen 80;
    listen 8092 ssl;

    server_name dev.ws;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    try_files $uri @ws;

    location /media {
        alias /usr/src/ws_sportparley/ws_sportparley/media;
        expires 365d;
    }

    location / {
        proxy_pass http://ws_balanceado;
        proxy_redirect off;
        proxy_read_timeout 5m;
        proxy_set_header Host $host:80;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}