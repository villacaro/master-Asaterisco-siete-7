upstream sbp_ws_balanceado{
    server ws:8001;
}
server {
    listen 8081;
    listen 8088 ssl;

    server_name digital.api;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/all.crt;
    ssl_certificate_key /etc/nginx/ssl/all.key;

    location /static {
        alias /usr/src/WSWebAPI/staticfiles;
        expires 365d;
    }

    location /media {
        alias /usr/src/WSWebAPI/ws_sportparley/media;
        expires 365d;
    }

    location / {
        proxy_pass http://sbp_ws_balanceado;
        proxy_redirect off;
        proxy_read_timeout 5m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        if ($scheme = http) {
            return 301 https://$server_name$request_uri;
        }
    }
}
