upstream sbp_webapp_balanceado{
    server unix:/usr/src/ParlayWebApp/ParlayWebApp_unicornn_webapp_1.sock;
}
server {
	listen 80;
    listen 443 ssl; 

    server_name www.unicornn.com unicornn.com;
    charset utf-8;

    ssl_certificate /etc/nginx/ssl/webapp.crt;
    ssl_certificate_key /etc/nginx/ssl/webapp.key;
	
	location /static {
       alias /usr/src/ParlayWebApp/staticfiles;
       expires 365d;
    }

    location /media {
        alias /usr/src/ParlayWebApp/parlaywebapp/media;
        expires 365d;
    }

    location / {
        proxy_pass http://sbp_webapp_balanceado;
        proxy_redirect off;
        proxy_read_timeout 5m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

	if ($scheme = http) {
        return 301 https://$server_name$request_uri;
    }
}