redis:
  extends:
    file: docker-compose-common.yml
    service: redis
  log_driver: "none"

rabbit:
  extends:
    file: docker-compose-common.yml
    service: rabbit
  ports:
    - "8085:15672"
  log_driver: "none"

crontab:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: python manage.py celery worker --hostname=crontab -B -E -Q default
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

worker:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: /etc/app/conf/worker.bash
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

flower:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: python manage.py celery flower --port=5555 --basic_auth=sbp:sbp123 --persistent=True
  ports:
    - "8084:5555"
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

panel:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: /etc/app/conf/panel.bash
  links:
    - redis:redis
    - rabbit:rabbit

ws:
  extends:
    file: docker-compose-common.yml
    service: ws
  command: /etc/app/conf/ws.bash
  links:
    - redis:redis
    - rabbit:rabbit

webapp:
  extends:
      file: docker-compose-common.yml
      service: webapp
  command: /etc/app/conf/webapp.bash
  links:
      - redis:redis

nodejs:
  extends:
    file: docker-compose-common.yml
    service: nodejs
  command: node server.js
  ports:
    - "8086:3000"
  links:
    - redis:redis