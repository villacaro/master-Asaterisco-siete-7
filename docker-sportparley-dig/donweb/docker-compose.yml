redis:
  extends:
    file: docker-compose-common.yml
    service: redis
  log_driver: "none"

rabbit:
  extends:
    file: docker-compose-common.yml
    service: rabbit
  ports:
    - "8094:15672"
  log_driver: "none"

crontab:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: python manage.py celery worker --hostname=crontab -B -E -Q default
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

worker:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: /etc/app/conf/worker.bash
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

flower:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: python manage.py celery flower --port=5555 --basic_auth=donweb:donweb123 --persistent=True
  ports:
    - "8093:5555"
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

panel:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: /etc/app/conf/panel.bash
  links:
    - redis:redis
    - rabbit:rabbit

ws:
  extends:
    file: docker-compose-common.yml
    service: ws
  command: /etc/app/conf/ws.bash
  links:
    - redis:redis
    - rabbit:rabbit