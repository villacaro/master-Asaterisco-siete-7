redis:
  extends:
    file: docker-compose-common.yml
    service: redis
  log_driver: "none"

rabbit:
  extends:
    file: docker-compose-common.yml
    service: rabbit
  log_driver: "none"

crontab:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: python manage.py celery worker --hostname=crontab -B -E -Q default
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

worker:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: /etc/app/conf/worker.bash
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

flower:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: python manage.py celery flower --port=5555 --basic_auth=galileo:galileo123 --persistent=True
  links:
    - redis:redis
    - rabbit:rabbit
  log_driver: "none"

panel:
  extends:
    file: docker-compose-common.yml
    service: panel
  command: /etc/app/conf/panel.bash
  links:
    - redis:redis
    - rabbit:rabbit

ws:
  extends:
    file: docker-compose-common.yml
    service: ws
  command: /etc/app/conf/ws.bash
  links:
    - redis:redis
    - rabbit:rabbit

nginx:
  extends:
    file: docker-compose-common.yml
    service: nginx
  volumes:
    - ./../../:/usr/src/
  ports:
    - "8090:8090"
    - "8091:8091"
    - "8092:8092"
    - "8093:8093"
    - "8094:8094"
  links:
    - flower:flower
    - rabbit:rabbit