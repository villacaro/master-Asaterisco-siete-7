upstream rabbit_balanceado{
    server rabbit:15672;
}
server {
    listen 8094;

    server_name www.matchpointparley.com, matchpointparley.com;
    charset utf-8;
    
    try_files $uri @rabbit;

    location / {
        proxy_pass http://rabbit_balanceado;
        proxy_redirect off;
        proxy_read_timeout 5m;
        proxy_set_header Host $host:8094;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}