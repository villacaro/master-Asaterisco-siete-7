upstream ws_balanceado{
    server unix:/usr/src/ws_sportparley/ws_sportparley_galileo_ws_1.sock;
    server unix:/usr/src/ws_sportparley/ws_sportparley_galileo_ws_2.sock;
}
server {
    listen 8091;
    listen 8092 ssl;

    server_name www.matchpointparley.com, matchpointparley.com;
    charset utf-8;

    try_files $uri @ws;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    location /static {
        alias /usr/src/ws_sportparley/staticfiles;
        expires 365d;
    }

    location /media {
        alias /usr/src/ws_sportparley/ws_sportparley/media;
        expires 365d;
    }

    location / {
        proxy_pass http://ws_balanceado;
        proxy_redirect off;
        proxy_read_timeout 5m;
        proxy_set_header Host $host:8091;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}